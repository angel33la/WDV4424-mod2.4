<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Settings</title>
    </head>

    <body>
        <main>
            <h1>Settings</h1>
            {% if picture %}
            <img src="{{ picture }}" alt="Profile picture" width="120" />
            {% endif %}
            <p>Nickname: {{ nickname }}</p>
            <form method="post">
                <label for="answer">Answer</label>
                <br />
                <textarea id="answer" name="answer" rows="6" cols="50">{{ answer }}</textarea>
                <br />
                <button type="submit">Submit</button>
            </form>
        </main>
    </body>

</html>
